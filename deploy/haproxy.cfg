global
	log /dev/log local0
	log /dev/log local1 notice
	daemon
	maxconn 4096

defaults
	log global
	mode tcp
	option tcplog
	timeout connect 5s
	timeout client 1m
	timeout server 1m

frontend tls_gateway
	bind *:443
	tcp-request inspect-delay 5s
	tcp-request content accept if { req.ssl_hello_type 1 }
	use_backend vaporwave_https if { req.ssl_sni -i server.aws-jp.focallog.com }
	default_backend existing_tls_service

backend vaporwave_https
	server caddy 127.0.0.1:8443 check

backend existing_tls_service
	server existing 127.0.0.1:4443 check
